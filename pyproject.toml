[project]
name = "huallaga-ai-monitor"
version = "0.1.0"
description = "SIVARH: Sistema Inteligente de Vigilancia Ambiental para las Riberas del Río Huallaga orientado a la detección preventiva del arrojo directo de residuos sólidos, sector Puente Huallaga – UNHEVAL"
authors = [
    { name = "Proyecto CyT Huallaga UNHEVAL", email = "investigacion@unheval.edu.pe" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "opencv-python>=4.9.0",
    "ultralytics>=8.1.0",
    "supervision>=0.30,<0.31",
    "trackers>=2.6,<3",
    "scipy>=1.13.1",
    "openai>=1.14.0",
    "Pillow>=10.2.0",
    "numpy>=2.0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sounddevice>=0.5.6",
    "reportlab>=4.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
